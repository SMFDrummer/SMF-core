name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      # Publishes the built mod jar as a workflow artifact, downloadable straight from the run
      # page (Actions -> the run -> Artifacts -> smfcore-jar). This is a CI artifact only: it is
      # not a release, and nothing is uploaded to a release or a package registry.
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: smfcore-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
